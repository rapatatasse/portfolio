<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan Chaffanjon - Portfolio en branches</title>
    <link rel="stylesheet" href="branches.css">
</head>
<body>
    <canvas id="stage"></canvas>

    <header id="brand">
        <h1>Jonathan Chaffanjon</h1>
        <p>Un parcours, plusieurs branches. Chaque expérience fait évoluer mes compétences.</p>
        <ul id="legend"></ul>
        <a class="back" href="index.html">&larr; CV classique</a>
    </header>

    <aside id="detail" class="hidden">
        <button id="detail-close" aria-label="Fermer">&times;</button>
        <div id="detail-img"><img alt=""></div>
        <div id="detail-thumbs"></div>
        <span id="detail-chip"></span>
        <h2 id="detail-title"></h2>
        <div id="detail-meta"></div>
        <p id="detail-desc"></p>
        <h3>Compétences gagnées</h3>
        <ul id="detail-gains"></ul>
    </aside>

    <aside id="pip">
        <div class="pip-screen">
            <nav class="pip-tabs">
                <button data-tab="stats" class="active">STATS</button>
                <button data-tab="data">CONTACT</button>
                <button data-tab="clients">CLIENTS</button>
            </nav>
            <section id="tab-stats" class="pip-tab active">
                <div class="pip-head">
                    <img id="pip-photo" alt="">
                    <div>
                        <div id="pip-name"></div>
                        <div id="pip-date"></div>
                        <div class="pip-lvl">LVL <b id="pip-lvl">1</b></div>
                    </div>
                </div>
                <div class="pip-xp"><span id="pip-xp"></span></div>
                <div id="pip-sum"></div>
                <div id="pip-skills"></div>
            </section>
            <section id="tab-data" class="pip-tab"><ul id="pip-contact"></ul></section>
            <section id="tab-clients" class="pip-tab"><ul id="pip-clients"></ul></section>
        </div>
    </aside>

    <footer id="timebar">
        <button id="play" aria-label="Lecture">&#9654;</button>
        <div id="slider-wrap">
            <div id="ticks"></div>
            <input id="year" type="range" min="0" max="1" step="0.001" value="0">
        </div>
        <div id="year-label"></div>
        <button id="reset" title="Vue d'ensemble">&#8634;</button>
    </footer>

    <div id="tooltip"></div>
    <div id="hint">Glisser : déplacer &middot; Molette : zoom &middot; Clic sur une carte : détails</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <script src="parcours.js"></script>
    <script src="branches-app.js"></script>
</body>
</html>
